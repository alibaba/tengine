
user  tengine;
worker_processes  auto;

error_log  /var/log/tengine/error.log  notice;
pid        /run/tengine.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/tengine/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/tengine/access.log  main;

    # The full feature set registers more variables than the 1024 default can
    # hold -- the timing variables plus the ones Lua, xquic and reqstat add --
    # so every start would otherwise warn about a suboptimal variables_hash.
    variables_hash_max_size 2048;

    # Lua runtime that ships with this package. resty.core is loaded on
    # startup, so these paths must stay in sync with the packaged lualib
    # directories -- @TENGINE_LIBDIR@ is substituted at package build time
    # (/usr/lib64 on RPM systems, /usr/lib elsewhere).
    lua_package_path  "/usr/share/tengine/lualib/?.lua;/usr/share/tengine/lualib/?/init.lua;;";
    lua_package_cpath "@TENGINE_LIBDIR@/tengine/lualib/?.so;;";

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_vary  on;
    gzip_proxied  any;
    gzip_comp_level  5;
    gzip_min_length  256;
    gzip_types  text/plain text/css text/xml application/json
                application/javascript application/xml+rss;

    # QUIC / HTTP-3 certificate. It lives here rather than in a server block
    # because xquic has no SNI -- one certificate serves every HTTP/3 host.
    # Uncomment together with a "listen ... xquic" listener in conf.d.
    #
    # The key has to be readable by the worker user: xquic builds its SSL
    # context per worker, after privileges are dropped, so a root-only key
    # kills every worker at startup (see conf.d/default.conf for details).
    #xquic_ssl_certificate     /etc/tengine/server.crt;
    #xquic_ssl_certificate_key /etc/tengine/server.key;

    # Drop in your own server blocks here.
    include /etc/tengine/conf.d/*.conf;
}
