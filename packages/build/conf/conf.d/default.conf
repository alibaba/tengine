server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    root   /usr/share/tengine/html;
    index  index.html index.htm;

    location / {
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
    }
}

# QUIC / HTTP-3 (ngx_http_xquic_module) is compiled in. It needs a UDP listener
# plus its own certificate, so enable it once you have a certificate in place.
#
# The xquic_* certificate directives are http level, NOT server level: xquic
# has no SNI, so one certificate serves every HTTP/3 virtual host. They belong
# in the http block of /etc/tengine/tengine.conf, where a commented-out pair is
# waiting -- putting them in a server block fails with "directive is not
# allowed here".
#
# That key must also be readable by the worker user (tengine). ssl_certificate_key
# is read by the master before it drops privileges, but xquic builds its SSL
# context in ngx_xquic_process_init, inside every worker. A key the worker cannot
# open fails engine_init, each worker exits with "fatal code 2 and cannot be
# respawned", and the server stops answering on every port -- plain HTTP
# included. With many workers the one useful error line scrolls past in a flood
# of alerts; worker_processes 1 brings it back.
#
# A server block only carries the listener:
#
# server {
#     listen 443 ssl;
#     listen 443 xquic;            # UDP; the "xquic" parameter selects HTTP/3
#     server_name  localhost;
#
#     ssl_certificate      /etc/tengine/server.crt;
#     ssl_certificate_key  /etc/tengine/server.key;
#
#     add_header Alt-Svc 'h3=":443"; ma=86400';
#
#     root  /usr/share/tengine/html;
# }
#
# NTLS (Tongsuo) is compiled in as well; a server block serving Chinese
# cryptography uses enable_ntls together with the dual SM2 certificate pair:
#
# server {
#     listen 443 ssl;
#     enable_ntls  on;
#     ssl_sign_certificate      /etc/tengine/sm2-sign.crt;
#     ssl_sign_certificate_key  /etc/tengine/sm2-sign.key;
#     ssl_enc_certificate       /etc/tengine/sm2-enc.crt;
#     ssl_enc_certificate_key   /etc/tengine/sm2-enc.key;
# }
