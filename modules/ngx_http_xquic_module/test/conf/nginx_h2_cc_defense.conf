worker_processes 1;
error_log  "logs/error.log" warn;
pid logs/tengine-proxy.pid;

events {
    worker_connections  10240;
}

processes {
        process strategy {}
}



http {
    access_log  logs/access.log;
    diamond_server jmenv.tbsite.net:8080;

    underscores_in_headers  on;
    diamond_config_path diamond/;
    diamond_app_config_inverval 1s;
    diamond_app ASERVER_NOT_EXIST aserver.http2.cc.defense.switch $http2_cc_defense_switch $http2_cc_defense_switch_version;
    xquic_ssl_certificate ../../../tests/nginx-tests/cases/certs/server.crt;
    xquic_ssl_certificate_key ../../../tests/nginx-tests/cases/certs/server.key;
    http2_cc_req_threshold 30; 

    http2_cc_defense_dismond_switch_name http2_cc_defense_switch;

    server {
        listen 2080 deferred ssl http2 https_allow_http default_server reuseport default_server;
        listen 2081 xquic reuseport rcvbuf=5242880;
        server_name *.taobao.com;
        ssl_certificate      ../../../../tests/nginx-tests/cases/certs/server.crt;
        ssl_certificate_key  ../../../../tests/nginx-tests/cases/certs/server.key;
 
        location / {
            content_by_lua '
              ngx.header.current_pid = ngx.var.pid;
              ngx.say("HTTP_OK");
            ';
        }
    }
}
