name: package tengine

# Builds native packages for the mainstream distro images. Manual/tag only:
# every target compiles Tongsuo (twice -- once for xquic, once through Tengine's
# own configure), xquic, LuaJIT and Tengine, which is far too heavy for a push.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'RPM dist tag override (e.g. .el7u2), empty for distro default'
        required: false
        default: ''
  push:
    tags:
      - 'tengine-*'

jobs:
  # A single timestamp for the whole run: the matrix jobs run on separate
  # runners, so each computing its own date would give every artifact a
  # different Release. This job also downloads the pinned third-party sources
  # once so that all 24 matrix jobs build from the identical bytes instead of
  # each re-fetching them.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.ts.outputs.value }}
    steps:
      - name: pin build timestamp
        id: ts
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: fetch and verify the pinned dependency sources
        run: packages/build/fetch-deps.sh --outdir dist/deps

      - uses: actions/upload-artifact@v4
        with:
          name: deps
          path: dist/deps
          if-no-files-found: error

  package:
    needs: prepare
    # aarch64 runs on native ARM runners: QEMU emulation would make a single
    # Tengine compile take 5-10x longer and risk the job timeout.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # el7 is best effort, both architectures. Two independent reasons:
    # CentOS 7 is EOL and its mirrors moved to vault.centos.org, whose main tree
    # is x86_64-only (the aarch64 archive lives under a different /altarch path
    # that the bootstrap rewrite does not cover); and the full feature set now
    # needs CMake >= 3.5 plus a compiler that copes with xquic's -std=gnu11 and
    # with Tongsuo's OpenSSL 3.0 base, which is a lot to ask of gcc 4.8.
    # If el7 keeps failing it should be dropped from the matrix outright -- a
    # release must not ship an el7 package with a smaller feature set than the
    # others under the same name.
    continue-on-error: ${{ matrix.target == 'el7' }}
    # Tongsuo is compiled twice, plus xquic, LuaJIT and Tengine itself.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
        target:
          - el7
          - el8
          - el9
          - el10
          - anolis8
          - openeuler2403
          - sles15
          - debian11
          - debian12
          - ubuntu2204
          - ubuntu2404
          - alpine
    steps:
      - uses: actions/checkout@v4

      # build.sh looks for the dependency tarballs here and skips downloading
      # anything whose checksum already matches, so this doubles as an offline
      # cache for the container build.
      - uses: actions/download-artifact@v4
        with:
          name: deps
          path: dist/deps

      # The runner architecture already selects the image variant, so no
      # --platform is needed here.
      - name: build ${{ matrix.target }} (${{ matrix.arch }})
        run: |
          packages/build/build.sh docker ${{ matrix.target }} \
            --timestamp ${{ needs.prepare.outputs.timestamp }} \
            ${{ inputs.dist_tag && format('--dist {0}', inputs.dist_tag) || '' }}

      - name: list artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tengine-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.apk
          if-no-files-found: error

  # Smoke-test one RPM and one DEB per architecture: install the package, check
  # the binary name and config path, that the config actually parses, and that
  # the three bundled subsystems really are in the build.
  verify:
    needs: package
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  target: el9,        image: 'rockylinux:9', kind: rpm }
          - { arch: aarch64, target: el9,        image: 'rockylinux:9', kind: rpm }
          - { arch: x86_64,  target: ubuntu2404, image: 'ubuntu:24.04', kind: deb }
          - { arch: aarch64, target: ubuntu2404, image: 'ubuntu:24.04', kind: deb }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tengine-${{ matrix.target }}-${{ matrix.arch }}
          path: pkgs

      - name: install and check (${{ matrix.kind }}, ${{ matrix.arch }})
        run: |
          docker run --rm -v "$PWD/pkgs:/pkgs:ro" ${{ matrix.image }} sh -euc '
            export DEBIAN_FRONTEND=noninteractive
            # `uname -m` keeps the glob off the .src.rpm that rpmbuild -ba emits
            case "${{ matrix.kind }}" in
                rpm) dnf -y install /pkgs/*."$(uname -m)".rpm ;;
                deb) apt-get update -qq && apt-get install -y /pkgs/*.deb ;;
            esac
            test -x /usr/sbin/tengine
            test -f /etc/tengine/tengine.conf
            # -V only succeeds if the dynamic linker resolved the bundled
            # libxquic.so and libluajit, i.e. it also tests the recorded rpath.
            /usr/sbin/tengine -V 2>&1 | tee /tmp/banner
            for mod in ngx_tongsuo_ntls ngx_http_xquic_module ngx_http_lua_module; do
                grep -q "$mod" /tmp/banner || { echo "MISSING: $mod"; exit 1; }
            done
            # Tongsuo keeps OPENSSL_VERSION_TEXT as "OpenSSL 3.0.3 ..." and
            # nginx never prints TONGSUO_VERSION_TEXT, so the banner cannot
            # distinguish it from a stock OpenSSL. enable-ntls in the configure
            # arguments can, and it is what ngx_tongsuo_ntls needs.
            grep -q "enable-ntls" /tmp/banner || { echo "MISSING: Tongsuo NTLS"; exit 1; }
            # resty.core is loaded during startup, so a passing -t also proves
            # lua_package_path points at the packaged lualib directory.
            /usr/sbin/tengine -t
          '

