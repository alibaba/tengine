name: package tengine

# Builds native packages for the mainstream distro images. Manual/tag only:
# every target compiles Tongsuo (twice -- once for xquic, once through Tengine's
# own configure), xquic, LuaJIT and Tengine, which is far too heavy for a push.
#
# On a tag push the packages are also published as GitHub release assets, which
# is what makes them permanently and anonymously downloadable; workflow
# artifacts expire after 90 days and require a login.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'RPM dist tag override (e.g. .el7u2), empty for distro default'
        required: false
        default: ''
  push:
    tags:
      - 'tengine-*'

jobs:
  # A single timestamp for the whole run: the matrix jobs run on separate
  # runners, so each computing its own date would give every artifact a
  # different Release. This job also downloads the pinned third-party sources
  # once so that all 24 matrix jobs build from the identical bytes instead of
  # each re-fetching them.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.ts.outputs.value }}
    steps:
      - name: pin build timestamp
        id: ts
        run: echo "value=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: fetch and verify the pinned dependency sources
        run: packages/build/fetch-deps.sh --outdir dist/deps

      - uses: actions/upload-artifact@v4
        with:
          name: deps
          path: dist/deps
          if-no-files-found: error

  package:
    needs: prepare
    # aarch64 runs on native ARM runners: QEMU emulation would make a single
    # Tengine compile take 5-10x longer and risk the job timeout.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Only el7 on aarch64 is best effort: CentOS 7 is EOL and its mirrors moved
    # to vault.centos.org, whose main tree is x86_64-only -- the aarch64 archive
    # lives under a different /altarch path that the bootstrap rewrite does not
    # cover, so that combination cannot succeed at all.
    #
    # el7 on x86_64 is NOT exempt. The full feature set was verified to build
    # with gcc 4.8.5 (Tongsuo's OpenSSL 3.0 base and xquic's -std=gnu11 with its
    # own -Werror both compile fine); the only real obstacle was CMake, which
    # bootstrap now installs from Kitware's static tarball. A failure there is
    # therefore real news, not an expected casualty.
    continue-on-error: ${{ matrix.target == 'el7' && matrix.arch == 'aarch64' }}
    # Tongsuo is compiled twice, plus xquic, LuaJIT and Tengine itself.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
        target:
          - el7
          - el8
          - el9
          - el10
          - anolis8
          - openeuler2403
          - sles15
          - debian11
          - debian12
          - ubuntu2204
          - ubuntu2404
          - alpine
    steps:
      - uses: actions/checkout@v4

      # build.sh looks for the dependency tarballs here and skips downloading
      # anything whose checksum already matches, so this doubles as an offline
      # cache for the container build.
      - uses: actions/download-artifact@v4
        with:
          name: deps
          path: dist/deps

      # The runner architecture already selects the image variant, so no
      # --platform is needed here.
      - name: build ${{ matrix.target }} (${{ matrix.arch }})
        run: |
          packages/build/build.sh docker ${{ matrix.target }} \
            --timestamp ${{ needs.prepare.outputs.timestamp }} \
            ${{ inputs.dist_tag && format('--dist {0}', inputs.dist_tag) || '' }}

      - name: list artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tengine-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.apk
          if-no-files-found: error

  # Smoke-test one RPM and one DEB per architecture: install the package, check
  # the binary name and config path, that the config actually parses, and that
  # the three bundled subsystems really are in the build.
  verify:
    needs: package
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  target: el9,        image: 'rockylinux:9', kind: rpm }
          - { arch: aarch64, target: el9,        image: 'rockylinux:9', kind: rpm }
          - { arch: x86_64,  target: ubuntu2404, image: 'ubuntu:24.04', kind: deb }
          - { arch: aarch64, target: ubuntu2404, image: 'ubuntu:24.04', kind: deb }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tengine-${{ matrix.target }}-${{ matrix.arch }}
          path: pkgs

      - name: install and check (${{ matrix.kind }}, ${{ matrix.arch }})
        run: |
          docker run --rm -v "$PWD/pkgs:/pkgs:ro" ${{ matrix.image }} sh -euc '
            export DEBIAN_FRONTEND=noninteractive
            # `uname -m` keeps the glob off the .src.rpm that rpmbuild -ba emits
            case "${{ matrix.kind }}" in
                rpm) dnf -y install /pkgs/*."$(uname -m)".rpm ;;
                deb) apt-get update -qq && apt-get install -y /pkgs/*.deb ;;
            esac
            test -x /usr/sbin/tengine
            test -f /etc/tengine/tengine.conf
            # -V only succeeds if the dynamic linker resolved the bundled
            # libxquic.so and libluajit, i.e. it also tests the recorded rpath.
            /usr/sbin/tengine -V 2>&1 | tee /tmp/banner
            for mod in ngx_tongsuo_ntls ngx_http_xquic_module ngx_http_lua_module; do
                grep -q "$mod" /tmp/banner || { echo "MISSING: $mod"; exit 1; }
            done
            # Tongsuo keeps OPENSSL_VERSION_TEXT as "OpenSSL 3.0.3 ..." and
            # nginx never prints TONGSUO_VERSION_TEXT, so the banner cannot
            # distinguish it from a stock OpenSSL. enable-ntls in the configure
            # arguments can, and it is what ngx_tongsuo_ntls needs.
            grep -q "enable-ntls" /tmp/banner || { echo "MISSING: Tongsuo NTLS"; exit 1; }
            # configure records its arguments verbatim, so an absolute path to
            # the dependency build tree would be printed by -V on every
            # installed system forever -- including whichever home directory
            # the package happened to be built in. build-deps.sh
            # --env-relative-to keeps those three arguments relative.
            ! grep -qE -- "--with-(openssl|xquic-(inc|lib))=/" /tmp/banner \
                || { echo "LEAK: absolute build path in banner"; exit 1; }
            # resty.core is loaded during startup, so a passing -t also proves
            # lua_package_path points at the packaged lualib directory.
            /usr/sbin/tengine -t
          '

  # Publish every package as a release asset. Unlike workflow artifacts these
  # never expire and need no GitHub login to download. Runs for release and
  # pre-release tags alike; a pre-release tag is only marked as such.
  release:
    needs: [package, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # "tengine-*" matches the per-target package artifacts and skips the
      # dependency-source artifact.
      - uses: actions/download-artifact@v4
        with:
          pattern: tengine-*
          path: artifacts

      - name: flatten artifacts into a release directory
        run: packages/build/collect-release.sh --indir artifacts --outdir release

      - name: classify the tag and write the release notes
        id: notes
        run: |
          set -eu
          version=${GITHUB_REF_NAME#tengine-}

          # Keep this rule identical to the one in docker.yml.
          case "$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')" in
              *-rc*|*rc[0-9]*|*-beta*|*-alpha*|*-pre*) prerelease=true ;;
              *)                                       prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # A sample RPM name for the install snippet, so the notes always point
          # at a file that actually exists in this release.
          sample_rpm=$(cd release && ls -1 *.el9.x86_64.rpm 2>/dev/null | head -n 1 || true)
          [ -n "$sample_rpm" ] || sample_rpm=$(cd release && ls -1 *.x86_64.rpm | head -n 1)
          sample_deb=$(cd release && ls -1 *_amd64.deb | head -n 1)
          base_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          cat > notes.md <<EOF
          Tengine $version packages and container images.

          Every artifact here is built with the full feature set: **Tongsuo**
          (NTLS / Chinese cryptography), **xquic** (QUIC and HTTP/3) and the
          **LuaJIT** scripting stack, all from the versions pinned in
          \`packages/build/deps.env\`. Tongsuo is linked statically, so these
          builds do not follow the system OpenSSL.

          The server installs as \`/usr/sbin/tengine\`, configured through
          \`/etc/tengine/tengine.conf\`, and can coexist with a distro nginx.

          ## Install

          RPM (RHEL / Rocky / Alma / Anolis / openEuler / SLES):

          \`\`\`sh
          dnf install $base_url/$sample_rpm
          \`\`\`

          DEB (Debian / Ubuntu -- the \`~codename\` suffix picks the right build):

          \`\`\`sh
          curl -fLO $base_url/$sample_deb
          apt install ./$sample_deb
          \`\`\`

          Alpine:

          \`\`\`sh
          apk add --allow-untrusted tengine-*.apk
          \`\`\`

          ## Container images

          \`\`\`sh
          docker pull ghcr.io/$owner/tengine:$version
          docker pull ghcr.io/$owner/tengine:$version-alpine
          \`\`\`

          Both are multi-arch (amd64 + arm64).

          ## Verify

          \`\`\`sh
          curl -fLO $base_url/SHA256SUMS
          sha256sum -c SHA256SUMS
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
          prerelease: ${{ steps.notes.outputs.prerelease }}
          fail_on_unmatched_files: true
